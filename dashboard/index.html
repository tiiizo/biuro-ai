<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI office</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(180deg, #a9dcf0 0%, #cdeef7 55%, #f6ecd9 100%); }
      body { font-family: ui-monospace, 'SF Mono', Menlo, monospace; color: #1d1b29; }
      #scene { position: fixed; inset: 0; }
      canvas.scene { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: grab; }
      canvas.scene:active { cursor: grabbing; }
      .labels { position: absolute; inset: 0; pointer-events: none; }
      .label {
        position: absolute; left: 0; top: 0; white-space: nowrap;
        font-size: 10px; line-height: 1; padding: 2px 4px 2px 5px;
        background: #fffdf7; color: #1d1b29; border: 2px solid #1d1b29;
        border-left: 5px solid var(--accent, #1d1b29);
        box-shadow: 2px 2px 0 rgba(29, 27, 41, 0.35);
        translate: -50% -50%;
      }
      .label.alarm { color: #b00020; border-color: #e63946; font-weight: bold; }
      .label.floor {
        background: #1d1b29; color: #fffdf7; border-color: #1d1b29; border-left-width: 2px;
        translate: 10px -50%; font-weight: bold; letter-spacing: 0.04em;
      }
      #header {
        position: fixed; top: 10px; left: 12px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
        font-size: 12px; background: #fffdf7; border: 2px solid #1d1b29; padding: 5px 9px;
        box-shadow: 3px 3px 0 rgba(29, 27, 41, 0.35); max-width: calc(100vw - 180px); z-index: 5;
      }
      #header strong { font-size: 13px; }
      .warnings summary { cursor: pointer; color: #8a5a00; }
      .warnings div { color: #8a5a00; margin-top: 3px; }
      #error {
        position: fixed; top: 60px; left: 50%; transform: translateX(-50%); width: min(760px, calc(100vw - 48px));
        background: #fde8e8; border: 3px solid #9b2226; padding: 1rem 1.25rem; box-shadow: 4px 4px 0 rgba(155, 34, 38, 0.35);
      }
      #error h2 { margin: 0 0 0.5rem; font-size: 16px; color: #9b2226; }
      #error pre { white-space: pre-wrap; margin: 0 0 0.5rem; font-size: 13px; }
      #error p { margin: 0; font-size: 12px; }
      canvas.scene.over-room { cursor: pointer; }
      .label.highlighted { background: #1d1b29; color: #fffdf7; z-index: 1; }
      .label.alarm.highlighted { color: #ffd6da; }
      .card {
        background: #fffdf7; border: 2px solid #1d1b29; box-shadow: 3px 3px 0 rgba(29, 27, 41, 0.35);
      }
      .muted { color: #5d5a6e; }
      button { font: inherit; color: inherit; cursor: pointer; }
      button:focus-visible, a:focus-visible { outline: 3px solid #f2a900; outline-offset: 2px; }
      #toggle {
        position: fixed; top: 10px; right: 12px; font-size: 12px; padding: 5px 10px; background: #fffdf7;
        border: 2px solid #1d1b29; box-shadow: 3px 3px 0 rgba(29, 27, 41, 0.35); z-index: 5;
      }
      #toggle[aria-pressed='true'] { background: #1d1b29; color: #fffdf7; }
      #tooltip {
        position: fixed; left: 0; top: 0; z-index: 6; pointer-events: none; max-width: 360px;
        font-size: 12px; padding: 7px 9px; line-height: 1.35;
      }
      .tooltip-title strong { font-size: 13px; }
      .tooltip-open { margin-top: 2px; }
      .tooltip-tasks { margin: 5px 0 0; padding: 0; list-style: none; }
      .tooltip-tasks li { margin-top: 3px; }
      .tooltip-footer { margin-top: 6px; color: #5d5a6e; font-size: 11px; }
      .types { font-weight: bold; color: #41506b; }
      .waiting { color: #5d5a6e; white-space: nowrap; }
      .waiting.alarm, .alarm { color: #b00020; font-weight: bold; }
      #panel {
        position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 7; overflow-y: auto;
        background: #fffdf7; border-left: 3px solid #1d1b29; box-shadow: -4px 0 0 rgba(29, 27, 41, 0.25);
        padding: 14px 16px 24px; box-sizing: border-box; font-size: 13px;
      }
      .panel-header { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
      #panel h2 { margin: 0; font-size: 17px; outline: none; }
      #panel h2:focus-visible { text-decoration: underline 3px #f2a900; }
      .close { font-size: 18px; line-height: 1; padding: 2px 8px; background: #fffdf7; border: 2px solid #1d1b29; }
      .panel-meta { margin: 6px 0; }
      .panel-theme { margin: 0 0 8px; color: #5d5a6e; font-style: italic; }
      .sorting { display: flex; gap: 6px; align-items: center; margin: 10px 0 4px; }
      .sort, .open-panel { font-size: 12px; padding: 2px 8px; background: #fffdf7; border: 2px solid #1d1b29; }
      .sort[aria-pressed='true'] { background: #1d1b29; color: #fffdf7; }
      .tasks { list-style: none; margin: 6px 0 0; padding: 0; }
      .task { border-top: 1px dashed #b9b4a6; padding: 7px 0; }
      .task-row { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
      .task .title { flex: 1 1 140px; color: #1d1b29; }
      .task a.title { text-decoration: underline; text-decoration-color: #9b97a8; }
      .type { text-decoration: none; margin-right: 1px; }
      .type-B { color: #b00020; } .type-q { color: #8a5a00; } .type-YOU { color: #1d5f99; }
      .type-AI { color: #2d6a4f; } .type-wip { color: #5d5a6e; }
      .copy { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; padding: 0 5px; background: #fffdf7; border: 2px solid #1d1b29; font-size: 13px; line-height: 1.4; }
      .context { margin: 3px 0 0; color: #3e3b4d; font-size: 12px; }
      #list {
        position: fixed; inset: 0; z-index: 4; overflow-y: auto; background: #f6f1e6;
        /* The fixed #header (z-index 5) covers the top of the list: focus and scrolling stop below it. */
        scroll-padding-top: 72px;
        padding: 56px max(16px, calc(50vw - 420px)) 40px; box-sizing: border-box; font-size: 13px;
      }
      #list h1 { font-size: 18px; margin: 0 0 4px; }
      #list h2 { font-size: 15px; margin: 22px 0 6px; padding: 3px 8px; background: #1d1b29; color: #fffdf7; display: inline-block; }
      .list-room { background: #fffdf7; border: 2px solid #1d1b29; padding: 8px 12px; margin: 8px 0; }
      .list-room h3 { margin: 0; font-size: 14px; }
      #toast {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 8; max-width: min(820px, calc(100vw - 32px));
        font-size: 12px; padding: 6px 10px; overflow-wrap: anywhere;
      }
      #toast.error { border-color: #9b2226; background: #fde8e8; }
      [hidden] { display: none !important; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="scene" aria-label="Isometric view of the office (full content in the list view)" role="img"></div>
    <!-- The toggle comes before the header: first in Tab order even when the header has warnings (<details>). -->
    <button id="toggle" type="button" aria-pressed="false" aria-controls="list">List view</button>
    <div id="header"></div>
    <main id="list" aria-label="List view" hidden></main>
    <div id="tooltip" class="card" aria-hidden="true" hidden></div>
    <aside id="panel" aria-labelledby="panel-title" hidden></aside>
    <div id="toast" class="card" aria-hidden="true" hidden></div>
    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
    <div id="error" role="alert" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
